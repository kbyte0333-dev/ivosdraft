<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <title>Page not found — invictusOS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: #070b14;
        color: #f6f8fc;
        font-family: Arial, Helvetica, sans-serif;
      }
      .error-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: radial-gradient(circle at 50% 38%, rgba(30, 105, 242, .09), transparent 32rem), #070b14;
      }
      .error-card {
        width: min(100%, 620px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brand {
        margin: 0 0 clamp(64px, 12vh, 104px);
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -.05em;
      }
      .error-code {
        color: #2d7df6;
        font-size: clamp(8.5rem, 25vw, 13.5rem);
        font-weight: 800;
        letter-spacing: -.11em;
        line-height: .72;
        text-indent: -.08em;
        text-shadow: 0 0 56px rgba(45, 125, 246, .12);
      }
      .message { margin-top: 52px; }
      .eyebrow { margin: 0 0 12px; color: #f6f8fc; font-size: 15px; font-weight: 700; }
      h1 { margin: 0; color: #f6f8fc; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; letter-spacing: -.045em; }
      .description { margin: 12px 0 0; color: #8793a8; font-size: 14px; line-height: 1.6; }
      .home-button {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 30px;
        padding: 12px 17px;
        border: 1px solid #2d7df6;
        border-radius: 7px;
        color: #fff;
        background: #2d7df6;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      .home-button:focus-visible { outline: 3px solid rgba(100, 162, 255, .55); outline-offset: 4px; }
      .home-button svg { width: 16px; height: 16px; }
      @media (max-width: 520px) {
        .error-page { padding: 24px 20px; }
        .brand { margin-bottom: 78px; }
        .message { margin-top: 44px; }
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <section class="error-card" aria-labelledby="error-title">
        <p class="brand" aria-label="invictusOS home">invictusOS</p>
        <div class="error-code" aria-hidden="true">404</div>
        <div class="message">
          <p class="eyebrow">Page not found</p>
          <h1 id="error-title">This page doesn’t exist.</h1>
          <p class="description">The link may be outdated, or the page may have moved.</p>
        </div>
        <a class="home-button" href="https://www.webinvictusos.neocities.org" aria-label="Return to the invictusOS home page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <span>Return home</span>
        </a>
      </section>
    </main>
  </body>
</html>
